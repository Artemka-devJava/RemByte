# ============================================================
# FixByte CRM — Docker Compose (сеть macvlan)
#
# Контейнер приложения получает СВОЙ IP в вашей локальной сети,
# как отдельное устройство. Телефоны (Android/iOS клиенты) заходят
# по этому IP напрямую:  http://<CRM_IP>:9087
#
# ВАЖНО:
#  • Работает только на Linux-хосте, физически подключённом к сети
#    (обычно кабелем). В Docker Desktop для Windows/macOS macvlan
#    НЕ выставляет контейнер в физическую сеть — используйте обычный
#    docker-compose.yml с проброшенным портом.
#  • Хост Docker по умолчанию НЕ видит macvlan-контейнеры —
#    для доступа с самого хоста поднимите shim:
#      sudo ./docker/macvlan/host-shim.sh up
#
# Запуск:
#   cp .env.macvlan .env   # и отредактируйте под свою сеть
#   docker compose -f docker-compose.macvlan.yml up -d --build
# ============================================================

name: fixbyte-crm

networks:
  # LAN через macvlan — приложение видно в физической сети
  crm_lan:
    driver: macvlan
    driver_opts:
      parent: ${MACVLAN_PARENT}
    ipam:
      config:
        - subnet: ${LAN_SUBNET}
          gateway: ${LAN_GATEWAY}
          ip_range: ${LAN_IP_RANGE}

  # Приватная сеть app <-> db, наружу не выходит
  crm_internal:
    driver: bridge
    internal: true

services:

  # ── MariaDB (только во внутренней сети, наружу не торчит) ──
  db:
    image: mariadb:11.4
    container_name: fixbyte-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      MARIADB_DATABASE: rembyte
    volumes:
      - fixbyte-db-data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - crm_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ── Spring Boot App (свой IP в LAN) ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fixbyte/crm:local
    container_name: fixbyte-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # БД доступна по имени сервиса во внутренней сети
      MARIADB_URL: jdbc:mariadb://db:3306/rembyte?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      MARIADB_USERNAME: root
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      FIXBYTE_ADMIN_USERNAME: ${FIXBYTE_ADMIN_USERNAME:-admin}
      FIXBYTE_ADMIN_PASSWORD: ${FIXBYTE_ADMIN_PASSWORD:-changeme}
      FIXBYTE_OPERATOR_USERNAME: ${FIXBYTE_OPERATOR_USERNAME:-operator}
      FIXBYTE_OPERATOR_PASSWORD: ${FIXBYTE_OPERATOR_PASSWORD:-changeme}
    networks:
      crm_lan:
        ipv4_address: ${CRM_IP}
        priority: 100          # LAN-шлюз — основной маршрут
      crm_internal:
        priority: 10
    # порт не пробрасываем: приложение слушает ${CRM_IP}:9087 прямо в LAN
    depends_on:
      db:
        condition: service_healthy

volumes:
  fixbyte-db-data:
    driver: local
