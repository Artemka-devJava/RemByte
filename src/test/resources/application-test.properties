# Профиль для JPA-тестов: встроенная H2 вместо MariaDB
spring.datasource.url=jdbc:h2:mem:rembyte;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# mvn test запускается из корня репозитория, где spring.config.import
# (application.properties) подхватывает боевой .env — на всякий случай
# явно отключаем хранилище бэкапов для тестов (полноконтекстные
# @SpringBootTest не должны трогать реальный FIXBYTE_BACKUP_DIR).
fixbyte.backup.dir=

# ApplicationConfiguration (сидинг пользователей) требует эти четыре
# свойства без дефолта в base application.properties — задаём тестовые
# значения, как в h2-профиле, чтобы полноконтекстные @SpringBootTest
# вообще могли подняться (без реального .env их взять неоткуда — Surefire
# форкает JVM с другим working directory, .env оттуда не виден).
fixbyte.admin.username=admin
fixbyte.admin.password=admin
fixbyte.operator.username=operator
fixbyte.operator.password=operator
