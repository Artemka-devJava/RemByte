# Профиль запуска без MariaDB — встроенная файловая H2.
# Активируется скриптом run.ps1 / run.sh, если MariaDB недоступна.
# Данные лежат в ./data/rembyte-h2.mv.db и сохраняются между запусками.
spring.datasource.url=jdbc:h2:file:./data/rembyte-h2;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2-консоль на /h2-console (уже в permitAll в SecurityConfig)
spring.h2.console.enabled=true

fixbyte.admin.username=${FIXBYTE_ADMIN_USERNAME:admin}
fixbyte.admin.password=${FIXBYTE_ADMIN_PASSWORD:admin}
fixbyte.operator.username=${FIXBYTE_OPERATOR_USERNAME:operator}
fixbyte.operator.password=${FIXBYTE_OPERATOR_PASSWORD:operator}
