<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клиенты — FixByte CRM</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="/images/logo.png" alt="FixByte логотип"></div>
      <div><span class="logo-text">FixByte</span><span class="logo-sub">CRM-система</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/"           class="nav-item"><span class="nav-icon">🏠</span>Главная</a>
      <a href="/dashboard"  class="nav-item"><span class="nav-icon">📊</span>Панель</a>
      <a href="/clients"    class="nav-item active"><span class="nav-icon">👥</span>Клиенты</a>
      <a href="/orders"     class="nav-item"><span class="nav-icon">📋</span>Заказы</a>
      <a href="/services"   class="nav-item"><span class="nav-icon">🔧</span>Услуги</a>
      <a href="/calculator" class="nav-item"><span class="nav-icon">💰</span>Калькулятор</a>

      <a href="/admin"      class="nav-item" sec:authorize="hasRole('ADMIN')"><span class="nav-icon">⚙️</span>Настройки</a>
    </nav>
    <div class="theme-switcher">
      <label for="themeSelectClients">Тема</label>
      <select id="themeSelectClients" class="theme-select" data-theme-select>
        <option value="system">🔄 Системная</option>
        <option value="light">☀️ Светлая</option>
        <option value="dark">🌙 Тёмная</option>
        <option value="fixbyte">⚡ FixByte</option>
        <option value="green">🌿 Зелёная</option>
        <option value="purple">💜 Фиолетовая</option>
        <option value="ocean">🌊 Океан</option>
        <option value="sunset">🌅 Закат</option>
      </select>
    </div>
    <div class="sidebar-footer">FixByte CRM © 2026</div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" th:text="'👤 ' + ${#authentication?.name ?: ''}">👤 admin</div>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
        <button type="submit" class="btn-sidebar-logout">🚪 Выйти</button>
      </form>
    </div>
  </aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>👥 Клиенты</h1>
      <button class="btn btn-primary" onclick="openCreateClientForm()">+ Новый клиент</button>
    </header>

    <main class="content">
      <div class="search-bar">
        <input type="text" id="searchClient" placeholder="Поиск по имени, телефону или email...">
        <button onclick="searchClients()">🔍 Найти</button>
      </div>

      <div class="filter-bar">
        <label>Показывать:</label>
        <select id="filterActive" onchange="loadClients()">
          <option value="">Все клиенты</option>
          <option value="true">Только активные</option>
          <option value="false">Неактивные</option>
        </select>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ФИО / Название</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Адрес</th>
                <th>Статус</th>
                <th>Добавлен</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="clientsTable">
              <tr><td colspan="7" class="empty">Загрузка клиентов...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<!-- Модал: создать/редактировать клиента -->
<div id="createClientModal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="clientModalTitle">Новый клиент</h2>
      <button class="close" onclick="closeCreateClientForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="createClientForm" onsubmit="submitClient(event)">
        <div class="form-group">
          <label>ФИО / Название организации:</label>
          <input type="text" id="clientName" required placeholder="Иван Петров">
        </div>
        <div class="form-group">
          <label>Телефон:</label>
          <input type="tel" id="clientPhone" required placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="clientEmail" placeholder="client@example.com">
        </div>
        <div class="form-group">
          <label>Адрес:</label>
          <textarea id="clientAddress" placeholder="г. Москва, ул. Примерная..."></textarea>
        </div>
        <div class="form-group">
          <label>Заметки:</label>
          <textarea id="clientNotes" placeholder="Дополнительная информация..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/clients.js"></script>
</body>
</html>
