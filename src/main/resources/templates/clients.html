<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Клиенты')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar('themeSelectClients')}"></aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>👥 Клиенты</h1>
      <button class="btn btn-primary" onclick="openCreateClientForm()">+ Новый клиент</button>
    </header>

    <main class="content">
      <div class="search-bar">
        <input type="text" id="searchClient" placeholder="Поиск по имени, телефону или email...">
        <button onclick="searchClients()">🔍 Найти</button>
      </div>

      <div class="filter-bar">
        <label>Показывать:</label>
        <select id="filterActive" onchange="loadClients()">
          <option value="">Все клиенты</option>
          <option value="true">Только активные</option>
          <option value="false">Неактивные</option>
        </select>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ФИО / Название</th>
                <th>Телефон</th>
                <th>Email</th>
                <th>Адрес</th>
                <th>Статус</th>
                <th>Добавлен</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="clientsTable">
              <tr><td colspan="7" class="empty">Загрузка клиентов...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<!-- Модал: создать/редактировать клиента -->
<div id="createClientModal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="clientModalTitle">Новый клиент</h2>
      <button class="close" onclick="closeCreateClientForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="createClientForm" onsubmit="submitClient(event)">
        <div class="form-group">
          <label>ФИО / Название организации:</label>
          <input type="text" id="clientName" required placeholder="Иван Петров">
        </div>
        <div class="form-group">
          <label>Телефон:</label>
          <input type="tel" id="clientPhone" required placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="clientEmail" placeholder="client@example.com">
        </div>
        <div class="form-group">
          <label>Адрес:</label>
          <textarea id="clientAddress" placeholder="г. Москва, ул. Примерная..."></textarea>
        </div>
        <div class="form-group">
          <label>Заметки:</label>
          <textarea id="clientNotes" placeholder="Дополнительная информация..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
      </form>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/clients.js"></script>
</body>
</html>
