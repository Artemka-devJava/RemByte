<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Клиенты')}"></th:block>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar()}"></aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>👥 Клиенты</h1>
      <button class="btn btn-primary" onclick="openCreateClientForm()">+ Новый клиент</button>
    </header>

    <main class="content">
      <div class="search-bar">
        <input type="text" id="searchClient" placeholder="Поиск по имени, телефону или email...">
        <button onclick="searchClients()">🔍 Найти</button>
      </div>

      <div class="filter-bar">
        <label>Показывать:</label>
        <select id="filterMode" onchange="loadClients()">
          <option value="active">Активные</option>
          <option value="archived">Архив</option>
          <option value="all">Все</option>
        </select>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ФИО / Название</th>
                <th>Телефон</th>
                <th>Тип</th>
                <th>Метки</th>
                <th>Добавлен</th>
              </tr>
            </thead>
            <tbody id="clientsTable">
              <tr><td colspan="5" class="empty">Загрузка клиентов...</td></tr>
            </tbody>
          </table>
        </div>
        <p class="hint" style="padding:10px 4px 0;">Нажмите на строку — откроется карточка клиента со всей историей.</p>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<!-- Модал: быстрое создание клиента -->
<div id="createClientModal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Новый клиент</h2>
      <button class="close" onclick="closeCreateClientForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="createClientForm" onsubmit="submitClient(event)">
        <div class="form-group">
          <label>ФИО / Название организации:</label>
          <input type="text" id="clientName" required placeholder="Иван Петров">
        </div>
        <div class="form-group">
          <label>Телефон:</label>
          <input type="tel" id="clientPhone" required placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
          <label>Тип:</label>
          <select id="clientType">
            <option value="INDIVIDUAL">Физлицо</option>
            <option value="COMPANY">Организация</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="clientEmail" placeholder="client@example.com">
        </div>
        <div class="form-group">
          <label>Адрес:</label>
          <textarea id="clientAddress" placeholder="г. Москва, ул. Примерная..."></textarea>
        </div>
        <p class="hint">Остальное — тип, метки, устройства, согласия — заполняется в карточке клиента.</p>
        <button type="submit" class="btn btn-primary btn-block">Создать и открыть карточку</button>
      </form>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/clients.js"></script>
</body>
</html>
