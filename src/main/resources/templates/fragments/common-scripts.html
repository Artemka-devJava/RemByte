<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="uiBase">
  <div id="toast-container"></div>
  <!-- Мобильный оверлей для сайдбара -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Модалка подтверждения — замена window.confirm(), см. ui-common.js -->
  <div id="confirmModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:400px;">
      <div class="modal-header">
        <h2 id="confirmModalTitle">Подтверждение</h2>
      </div>
      <div class="modal-body">
        <p id="confirmModalMessage" style="margin:0;color:var(--c-text);white-space:pre-line;"></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="confirmModalCancel" class="btn btn-sm btn-secondary">Отмена</button>
        <button type="button" id="confirmModalOk" class="btn btn-sm btn-danger">Да, удалить</button>
      </div>
    </div>
  </div>

  <script src="/js/ui-common.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/plugin-host.js"></script>
  <script src="/js/reminders-notify.js"></script>
  <script src="/js/combobox.js"></script>
  <script src="/js/global-search.js"></script>
  <script>
    (function () {
      function ensureBurgerButton() {
        if (document.getElementById('burgerBtn')) {
          return;
        }

        // Вставляем кнопку-бургер в top-bar для мобильных
        var topBar = document.querySelector('.top-bar');
        var burger = document.createElement('button');
        burger.type = 'button';
        burger.className = 'burger-btn';
        burger.id = 'burgerBtn';
        burger.setAttribute('aria-label', 'Открыть меню');
        burger.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">'
          + '<rect y="4" width="22" height="2.2" rx="1.1" fill="currentColor"/>'
          + '<rect y="10" width="22" height="2.2" rx="1.1" fill="currentColor"/>'
          + '<rect y="16" width="22" height="2.2" rx="1.1" fill="currentColor"/>'
          + '</svg>';
        burger.style.color = 'var(--c-text)';

        if (topBar) {
          topBar.insertBefore(burger, topBar.firstChild);
        } else {
          // Fallback: плавающая кнопка для страниц без .top-bar
          burger.classList.add('floating-burger');
          document.body.appendChild(burger);
        }
      }

      ensureBurgerButton();

      var sidebar = document.querySelector('.sidebar');
      var overlay = document.getElementById('sidebarOverlay');
      var closeBtn = document.getElementById('sidebarCloseBtn');

      function openSidebar() {
        if (sidebar) sidebar.classList.add('sidebar-mobile-open');
        if (overlay) overlay.classList.add('active');
        document.body.classList.add('sidebar-open');
      }

      function closeSidebar() {
        if (sidebar) sidebar.classList.remove('sidebar-mobile-open');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('sidebar-open');
      }

      var burgerBtn = document.getElementById('burgerBtn');
      if (burgerBtn) burgerBtn.addEventListener('click', openSidebar);
      if (overlay) overlay.addEventListener('click', closeSidebar);
      if (closeBtn) closeBtn.addEventListener('click', closeSidebar);

      // Закрываем сайдбар при переходе по ссылке на мобильных
      if (sidebar) {
        sidebar.querySelectorAll('.nav-item').forEach(function(link) {
          link.addEventListener('click', function() {
            if (window.innerWidth <= 768) closeSidebar();
          });
        });
      }

      // Закрываем при изменении размера (если стал десктоп)
      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) closeSidebar();
      });

      window.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          closeSidebar();
        }
      });
    })();
  </script>
</th:block>
</body>
</html>
