<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Онлайн-чат')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar('themeSelectChat')}"></aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>💬 Онлайн-чат с сайта</h1>
      <div class="chat-topbar-stats">
        <span class="chat-stat-pill">Непрочитанных: <strong id="chatUnreadCount">0</strong></span>
        <span class="chat-stat-pill">Открытых: <strong id="chatOpenCount">0</strong></span>
        <button class="btn btn-secondary btn-sm" type="button" onclick="refreshChatData(true)">⟳ Обновить</button>
      </div>
    </header>

    <main class="content">
      <div class="chat-layout">
        <section class="card chat-sidebar-card">
          <div class="card-header">
            <h2>Диалоги</h2>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="chat-search-box">
              <input id="chatSearchInput" type="text" placeholder="Поиск по имени, телефону, email...">
            </div>
            <div id="chatConversationList" class="chat-conversation-list">
              <div class="chat-empty-state">Загрузка диалогов...</div>
            </div>
          </div>
        </section>

        <section class="card chat-main-card">
          <div class="card-header chat-thread-header">
            <div>
              <h2 id="chatThreadTitle">Выберите диалог</h2>
              <div id="chatThreadMeta" class="chat-thread-meta">Сообщения с сайта будут появляться здесь</div>
            </div>
            <div class="chat-thread-actions">
              <button id="chatToggleStatusBtn" class="btn btn-secondary btn-sm" type="button" onclick="toggleCurrentConversationStatus()" style="display:none;">Закрыть диалог</button>
            </div>
          </div>
          <div class="card-body chat-thread-body">
            <div id="chatConversationInfo" class="chat-conversation-info"></div>
            <div id="chatMessages" class="chat-messages">
              <div class="chat-empty-state">Слева выберите диалог, чтобы просмотреть переписку.</div>
            </div>
            <form id="chatReplyForm" class="chat-reply-form" onsubmit="sendChatReply(event)">
              <textarea id="chatReplyInput" placeholder="Введите ответ клиенту..." rows="3"></textarea>
              <div class="chat-reply-actions">
                <small>Ответ будет сразу виден в виджете на сайте клиента.</small>
                <button class="btn btn-primary" type="submit">Отправить</button>
              </div>
            </form>
          </div>
        </section>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/chat.js"></script>
</body>
</html>
