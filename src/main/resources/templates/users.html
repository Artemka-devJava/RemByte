<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Пользователи')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
    .role-admin    { background:#fef9c3; color:#a16207; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .role-operator { background:#dbeafe; color:#1d4ed8; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar('themeSelectUsers')}"></aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>🔑 Управление пользователями</h1>
      <button class="btn btn-primary" onclick="openCreateUserModal()">+ Новый пользователь</button>
    </header>

    <main class="content">
      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Логин</th>
                <th>Отображаемое имя</th>
                <th>Роль</th>
                <th>Статус</th>
                <th>Создан</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="usersTable">
              <tr><td colspan="7" class="empty">Загрузка...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<!-- Модал: создать / редактировать пользователя -->
<div id="userModal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:460px;">
    <div class="modal-header">
      <h2 id="userModalTitle">Новый пользователь</h2>
      <button class="close" onclick="closeUserModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="userForm" onsubmit="submitUser(event)">

        <div class="form-group">
          <label>Логин (для входа в систему):</label>
          <input type="text" id="uUsername" required placeholder="ivan_petrov"
                 autocomplete="off" style="font-family:monospace;">
        </div>

        <div class="form-group">
          <label>Отображаемое имя:</label>
          <input type="text" id="uDisplayName" placeholder="Иван Петров">
        </div>

        <div class="form-group">
          <label>Пароль: <small id="uPasswordHint" style="color:var(--c-muted);font-weight:400;">(обязательно при создании)</small></label>
          <input type="password" id="uPassword" placeholder="Введите пароль" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label>Роль:</label>
          <select id="uRole">
            <option value="OPERATOR">👷 Оператор — обычный доступ</option>
            <option value="ADMIN">👑 Администратор — полный доступ</option>
          </select>
        </div>

        <div class="form-group" id="uEnabledGroup" style="display:none;">
          <label style="display:flex;align-items:center;gap:10px;font-weight:400;cursor:pointer;">
            <input type="checkbox" id="uEnabled" checked style="width:16px;height:16px;accent-color:var(--c-primary);">
            Аккаунт активен
          </label>
        </div>

        <div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;padding:12px 14px;font-size:12.5px;color:#92400e;margin-bottom:4px;">
          ⚠️ Пароль хранится в открытом виде. Используйте только для внутренней системы.
        </div>
        <br>
        <button type="submit" class="btn btn-primary btn-block">💾 Сохранить</button>
      </form>
    </div>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
