<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Заметки')}"></th:block>
  <style>
    .notes-layout { display:grid; grid-template-columns: 260px 1fr; gap:16px; align-items:start; }

    .folder-create { display:flex; gap:8px; margin-bottom:12px; }
    .folder-create input { flex:1; min-width:0; }

    .list-row {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13.5px;
    }
    .list-row:hover { background: var(--c-bg); }
    .list-row.active { background: var(--c-primary-l); color: var(--c-primary); font-weight:600; }
    .list-row-main { min-width:0; flex:1; }
    .list-row-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .list-row-excerpt {
      margin-top:2px; font-size:12px; color:var(--c-muted); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis;
    }
    .list-row.active .list-row-excerpt { color: inherit; opacity:.75; }
    .list-row-meta { flex-shrink:0; font-size:11.5px; color:var(--c-muted); }
    .list-row-actions { display:flex; gap:2px; flex-shrink:0; opacity:0; transition:opacity .12s; }
    .list-row:hover .list-row-actions { opacity:1; }
    .icon-btn {
      width:24px; height:24px; border:none; border-radius:6px; background:transparent; color:var(--c-muted);
      font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .icon-btn:hover { background: rgba(148,163,184,.18); color: var(--c-text); }
    .icon-btn.danger:hover { background: var(--c-danger-bg); color: var(--c-danger); }

    .note-list { margin-bottom:12px; }
    .note-editor-wrap { border-top:1px solid var(--c-border); padding-top:12px; }
    #noteTitle { font-size:14px; font-weight:600; margin-bottom:8px; }
    #noteContent { width:100%; min-height:280px; resize:vertical; font-size:14px; line-height:1.6; }
    .note-editor-footer {
      margin-top:8px; display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .note-save-status { font-size:12px; color:var(--c-muted); }
    .note-save-status.unsaved { color: var(--c-warning, #b45309); }
    .note-editor-actions { display:flex; gap:8px; }

    .empty { padding:20px 10px; color:var(--c-muted); font-size:13px; text-align:center; }
    @media (max-width: 980px) {
      .notes-layout { grid-template-columns: 1fr; }
      .list-row-actions { opacity:1; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar()}"></aside>
  <div class="main-area">
    <header class="top-bar">
      <h1>Заметки</h1>
    </header>
    <main class="content">
      <div class="notes-layout">
        <section class="card">
          <div class="card-header"><h2>📁 Папки</h2></div>
          <div class="card-body">
            <div class="folder-create">
              <input type="text" id="newFolderName" placeholder="Новая папка">
              <button class="btn btn-sm btn-primary" id="btnCreateFolder">+</button>
            </div>
            <div id="foldersList"></div>
          </div>
        </section>
        <section class="card">
          <div class="card-header">
            <h2>📝 Заметки</h2>
            <button class="btn btn-sm btn-primary" id="btnCreateNote" disabled>+ Новая заметка</button>
          </div>
          <div class="card-body">
            <div id="notesList" class="note-list"></div>
            <div id="noteEditorWrap" class="note-editor-wrap" style="display:none;">
              <input type="text" id="noteTitle" placeholder="Название заметки">
              <textarea id="noteContent" placeholder="Текст заметки..."></textarea>
              <div class="note-editor-footer">
                <span id="noteSaveStatus" class="note-save-status"></span>
                <div class="note-editor-actions">
                  <button class="btn btn-sm btn-secondary" id="btnDownloadNote">Скачать</button>
                  <button class="btn btn-sm btn-danger" id="btnDeleteNote">Удалить</button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script th:src="@{/js/api.js(v=${assetVersion})}"></script>
<script th:src="@{/js/notes.js(v=${assetVersion})}"></script>
</body>
</html>
