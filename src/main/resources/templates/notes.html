<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заметки — FixByte CRM</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}

    .notes-layout { display:grid; grid-template-columns: 300px 1fr; gap: 14px; min-height: calc(100vh - 210px); }
    .folder-panel,.note-panel { border:1px solid var(--c-border); border-radius:10px; background:var(--c-card); }
    .panel-head { padding:10px 12px; border-bottom:1px solid var(--c-border); display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .panel-title { margin:0; font-size:14px; font-weight:700; }
    .panel-body { padding:10px; }

    .folder-create { display:flex; gap:8px; margin-bottom:10px; }
    .folder-create input { min-width: 0; flex: 1; height: 38px; font-size: 14px; }

    .folder-list, .note-list { display:flex; flex-direction:column; gap:6px; max-height: 520px; overflow-y: auto; }
    .folder-item, .note-item {
      border:1px solid var(--c-border); border-radius:8px; padding:8px 10px; background:var(--c-card);
      cursor:pointer; transition:all .15s;
    }
    .folder-item:hover, .note-item:hover { border-color: var(--c-primary); }
    .folder-item.active, .note-item.active { border-color: var(--c-primary); background: var(--c-primary-l); }
    .folder-name, .note-name { font-size:15px; font-weight:600; margin:0; }
    .folder-meta, .note-meta { margin:3px 0 0; font-size:12px; color:var(--c-muted); }

    .note-toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    .note-toolbar input[type="text"] { flex:1; min-width:180px; font-size:15px; }

    .md-mode-switch { display:flex; gap:8px; margin-bottom:8px; }
    .md-mode-btn { padding:6px 10px; border:1px solid var(--c-border); border-radius:8px; background:var(--c-card); cursor:pointer; font-size:13px; }
    .md-mode-btn.active { border-color: var(--c-primary); background: var(--c-primary-l); color: var(--c-primary); }

    .md-toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
    .md-tool-btn { padding:5px 8px; border:1px solid var(--c-border); border-radius:7px; background:var(--c-card); font-size:12px; cursor:pointer; }
    .md-tool-btn:hover { border-color: var(--c-primary); color: var(--c-primary); }

    .note-editor textarea { width:100%; min-height:320px; resize: vertical; font-size:16px; line-height:1.55; }
    .note-preview {
      width:100%; min-height:320px; border:1px solid var(--c-border); border-radius:8px; padding:12px;
      background: var(--c-card); font-size:16px; line-height:1.55; overflow:auto;
    }
    .note-preview h1,.note-preview h2,.note-preview h3 { margin: 0.6em 0 0.35em; }
    .note-preview p { margin: 0.35em 0; }
    .note-preview ul { margin: 0.35em 0 0.35em 1.2em; }
    .note-preview blockquote { border-left: 3px solid var(--c-border); margin: 0.5em 0; padding: 0.2em 0.8em; color: var(--c-muted); }
    .note-preview code { background: rgba(148,163,184,.14); padding: 2px 5px; border-radius: 6px; font-size: 0.9em; }
    .note-preview pre { background: #0f172a; color: #e2e8f0; padding: 10px; border-radius: 8px; overflow:auto; }
    .note-preview a { color: var(--c-primary); }
    .note-actions { margin-top:10px; display:flex; flex-wrap:wrap; gap:8px; }

    .empty { padding: 16px 10px; color: var(--c-muted); font-size: 14px; text-align: center; border:1px dashed var(--c-border); border-radius:8px; }

    @media (max-width: 980px) {
      .notes-layout { grid-template-columns: 1fr; }
      .folder-list, .note-list { max-height: 280px; }
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="/images/logo.png" alt="FixByte логотип"></div>
      <div><span class="logo-text">FixByte</span><span class="logo-sub">CRM-система</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item"><span class="nav-icon">🏠</span>Главная</a>
      <a href="/dashboard" class="nav-item"><span class="nav-icon">📊</span>Панель</a>
      <a href="/clients" class="nav-item"><span class="nav-icon">👥</span>Клиенты</a>
      <a href="/orders" class="nav-item"><span class="nav-icon">📋</span>Заказы</a>
      <a href="/services" class="nav-item"><span class="nav-icon">🔧</span>Услуги</a>
      <a href="/calculator" class="nav-item"><span class="nav-icon">💰</span>Калькулятор</a>
      <a href="/admin" class="nav-item" sec:authorize="hasRole('ADMIN')"><span class="nav-icon">⚙️</span>Настройки</a>
    </nav>
    <div class="theme-switcher">
      <label for="themeSelectNotes">Тема</label>
      <select id="themeSelectNotes" class="theme-select" data-theme-select>
        <option value="system">🔄 Системная</option>
        <option value="light">☀️ Светлая</option>
        <option value="dark">🌙 Тёмная</option>
        <option value="fixbyte">⚡ FixByte</option>
        <option value="green">🌿 Зелёная</option>
        <option value="purple">💜 Фиолетовая</option>
        <option value="ocean">🌊 Океан</option>
        <option value="sunset">🌅 Закат</option>
      </select>
    </div>
    <div class="sidebar-footer">FixByte CRM © 2026</div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" th:text="'👤 ' + ${#authentication?.name ?: ''}">👤 admin</div>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
        <button type="submit" class="btn-sidebar-logout">🚪 Выйти</button>
      </form>
    </div>
  </aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>🧩 Плагин заметок</h1>
    </header>

    <main class="content">
      <div class="notes-layout">
        <section class="folder-panel">
          <div class="panel-head">
            <h2 class="panel-title">📁 Папки</h2>
          </div>
          <div class="panel-body">
            <div class="folder-create">
              <input type="text" id="newFolderName" placeholder="Новая папка">
              <button class="btn btn-primary" id="btnCreateFolder">+ Создать</button>
            </div>
            <div id="foldersList" class="folder-list"></div>
          </div>
        </section>

        <section class="note-panel">
          <div class="panel-head">
            <h2 class="panel-title">📝 Заметки</h2>
            <button class="btn btn-primary" id="btnCreateNote" disabled>+ Новая заметка</button>
          </div>
          <div class="panel-body">
            <div id="notesList" class="note-list"></div>

            <div id="noteEditorWrap" class="note-editor" style="display:none; margin-top: 12px;">
              <div class="note-toolbar">
                <input type="text" id="noteTitle" placeholder="Название заметки">
              </div>
              <div class="md-mode-switch">
                <button class="md-mode-btn active" id="mdEditModeBtn" type="button">✍️ Редактирование</button>
                <button class="md-mode-btn" id="mdPreviewModeBtn" type="button">👁️ Превью</button>
              </div>
              <div class="md-toolbar">
                <button class="md-tool-btn" type="button" data-md-wrap="**|**">Жирный</button>
                <button class="md-tool-btn" type="button" data-md-wrap="*|*">Курсив</button>
                <button class="md-tool-btn" type="button" data-md-wrap="`|`">Код</button>
                <button class="md-tool-btn" type="button" data-md-insert="\n# Заголовок\n">H1</button>
                <button class="md-tool-btn" type="button" data-md-insert="\n## Подзаголовок\n">H2</button>
                <button class="md-tool-btn" type="button" data-md-insert="\n- Пункт 1\n- Пункт 2\n">Список</button>
                <button class="md-tool-btn" type="button" data-md-insert="\n> Цитата\n">Цитата</button>
                <button class="md-tool-btn" type="button" data-md-insert="\n[Текст ссылки](https://example.com)\n">Ссылка</button>
              </div>
              <textarea id="noteContent" placeholder="Введите текст заметки..."></textarea>
              <div id="notePreview" class="note-preview" style="display:none;"></div>
              <div class="note-actions">
                <button class="btn btn-success" id="btnSaveNote">💾 Сохранить</button>
                <button class="btn btn-secondary" id="btnDownloadNote">⬇️ Скачать</button>
                <button class="btn btn-danger" id="btnDeleteNote">🗑 Удалить</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/theme.js"></script>
<script src="/js/plugin-host.js"></script>
<script src="/js/api.js"></script>
<script src="/js/notes.js"></script>
</body>
</html>
