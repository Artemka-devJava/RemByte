<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор — FixByte CRM</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="/images/logo.png" alt="FixByte логотип"></div>
      <div><span class="logo-text">FixByte</span><span class="logo-sub">CRM-система</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/"           class="nav-item"><span class="nav-icon">🏠</span>Главная</a>
      <a href="/dashboard"  class="nav-item"><span class="nav-icon">📊</span>Панель</a>
      <a href="/clients"    class="nav-item"><span class="nav-icon">👥</span>Клиенты</a>
      <a href="/orders"     class="nav-item"><span class="nav-icon">📋</span>Заказы</a>
      <a href="/services"   class="nav-item"><span class="nav-icon">🔧</span>Услуги</a>
      <a href="/calculator" class="nav-item active"><span class="nav-icon">💰</span>Калькулятор</a>
    </nav>
    <div class="theme-switcher">
      <label for="themeSelectCalculator">Тема</label>
      <select id="themeSelectCalculator" class="theme-select" data-theme-select>
        <option value="system">Системная</option>
        <option value="light">Светлая</option>
        <option value="dark">Темная</option>
      </select>
    </div>
    <div class="sidebar-footer">FixByte CRM © 2026</div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" th:text="'👤 ' + ${#authentication?.name ?: ''}">👤 admin</div>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
        <button type="submit" class="btn-sidebar-logout">🚪 Выйти</button>
      </form>
    </div>
  </aside>

  <div class="main-area">
    <header class="top-bar"><h1>💰 Калькулятор стоимости</h1></header>
    <main class="content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
        <div class="card card-body calculator">
          <h2 style="font-size:15px;margin-bottom:16px;">Рассчитайте стоимость ремонта</h2>

          <div class="calc-section">
            <label style="font-weight:600;display:block;margin-bottom:8px;">1. Выберите услуги:</label>
            <div id="servicesList"></div>
          </div>

          <div class="calc-section">
            <label style="font-weight:600;display:block;margin-bottom:8px;">Дополнительные параметры:</label>
            <div class="form-group">
              <label style="font-weight:400;display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="additionalWork" onchange="calculatePrice()"> Дополнительная диагностика (+500₽)
              </label>
            </div>
            <div class="form-group">
              <label style="font-weight:400;display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="urgentOrder" onchange="calculatePrice()"> Срочный заказ (+20%)
              </label>
            </div>
            <div class="form-group">
              <label style="font-weight:400;display:flex;align-items:center;gap:8px;">
                <input type="checkbox" id="warranty" onchange="calculatePrice()"> Гарантия на работу (1 год) (+15%)
              </label>
            </div>
          </div>

          <div class="calc-section">
            <label style="font-weight:600;display:block;margin-bottom:8px;">Скидка (%):</label>
            <input type="number" id="discountPercent" min="0" max="100" value="0" onchange="calculatePrice()"
              style="width:100%;padding:8px 12px;border:1.5px solid var(--c-border);border-radius:7px;font-size:14px;">
          </div>

          <div class="calc-result">
            <div class="result-item"><span>Сумма услуг:</span><span id="servicesTotal">0₽</span></div>
            <div class="result-item"><span>Дополнения:</span><span id="additionalTotal">0₽</span></div>
            <div class="result-item"><span>Скидка:</span><span id="discountTotal">-0₽</span></div>
            <div class="result-item highlight"><span><strong>ИТОГО к оплате:</strong></span><span id="finalTotal"><strong>0₽</strong></span></div>
          </div>

          <div class="calc-actions">
            <button class="btn btn-primary" onclick="createOrderFromCalculator()">➕ Создать заказ</button>
            <button class="btn btn-secondary" onclick="resetCalculator()">🔄 Очистить</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2>📋 Прайс-лист услуг</h2></div>
          <div style="overflow-x:auto;">
            <table class="data-table" id="priceTable">
              <thead><tr><th>Категория</th><th>Услуга</th><th>Цена</th></tr></thead>
              <tbody><tr><td colspan="3" class="empty">Загрузка прайс-листа...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>
<div id="toast-container"></div>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
<script src="/js/calculator.js"></script>
</body>
</html>
