<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Калькулятор стоимости')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}

    /* чекбокс-группа — изолирована от .form-group правил */
    .check-group { margin-bottom: 8px; }
    .check-label {
      display: flex; align-items: center; gap: 9px;
      font-size: 13.5px; font-weight: 400; color: var(--c-text);
      cursor: pointer; user-select: none;
      padding: 7px 10px;
      border-radius: 7px;
      transition: background .15s;
    }
    .check-label:hover { background: var(--c-primary-l); }
    .check-label input[type="checkbox"] {
      width: 16px; height: 16px;
      flex-shrink: 0;
      accent-color: var(--c-primary);
      cursor: pointer;
      margin: 0; padding: 0;
    }
    .check-badge {
      margin-left: auto;
      font-size: 12px; font-weight: 600;
      color: var(--c-primary);
      background: var(--c-primary-l);
      padding: 2px 8px; border-radius: 12px;
      white-space: nowrap;
    }
    /* Заголовок категории в списке услуг */
    .calc-cat-header {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
      color: var(--c-muted);
      padding: 10px 10px 4px;
      margin-top: 4px;
      border-top: 1px solid var(--c-border);
    }
    .calc-cat-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar('themeSelectCalculator')}"></aside>

  <div class="main-area">
    <header class="top-bar"><h1>💰 Калькулятор стоимости</h1></header>
    <main class="content">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
        <div class="card card-body calculator">
          <h2 style="font-size:15px;margin-bottom:16px;">Рассчитайте стоимость ремонта</h2>

          <div class="calc-section">
            <label style="font-weight:600;display:block;margin-bottom:8px;">1. Выберите услуги:</label>
            <div id="servicesList"></div>
          </div>

          <div class="calc-section">
            <label style="font-weight:600;display:block;margin-bottom:8px;">Дополнительные параметры:</label>
            <div class="check-group">
              <label class="check-label">
                <input type="checkbox" id="additionalWork" onchange="calculatePrice()">
                <span>Дополнительная диагностика</span>
                <span class="check-badge">+500 ₽</span>
              </label>
            </div>
            <div class="check-group">
              <label class="check-label">
                <input type="checkbox" id="urgentOrder" onchange="calculatePrice()">
                <span>Срочный заказ</span>
                <span class="check-badge">+20%</span>
              </label>
            </div>
            <div class="check-group">
              <label class="check-label">
                <input type="checkbox" id="warranty" onchange="calculatePrice()">
                <span>Гарантия на работу (1 год)</span>
                <span class="check-badge">+15%</span>
              </label>
            </div>
          </div>

          <div class="calc-section">
            <div class="form-group" style="margin-bottom:0;">
              <label for="discountPercent" style="font-weight:600;">Скидка (%):</label>
              <input type="number" id="discountPercent" min="0" max="100" value="0"
                     onchange="calculatePrice()" class="form-control"
                     style="background:var(--c-card);color:var(--c-text);">
            </div>
          </div>

          <div class="calc-result">
            <div class="result-item"><span>Сумма услуг:</span><span id="servicesTotal">0₽</span></div>
            <div class="result-item"><span>Дополнения:</span><span id="additionalTotal">0₽</span></div>
            <div class="result-item"><span>Скидка:</span><span id="discountTotal">-0₽</span></div>
            <div class="result-item highlight"><span><strong>ИТОГО к оплате:</strong></span><span id="finalTotal"><strong>0₽</strong></span></div>
          </div>

          <div class="calc-actions">
            <button class="btn btn-primary" onclick="createOrderFromCalculator()">➕ Создать заказ</button>
            <button class="btn btn-secondary" onclick="resetCalculator()">🔄 Очистить</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h2>📋 Прайс-лист услуг</h2></div>
          <div style="overflow-x:auto;">
            <table class="data-table" id="priceTable">
              <thead><tr><th>Категория</th><th>Услуга</th><th>Цена</th></tr></thead>
              <tbody><tr><td colspan="3" class="empty">Загрузка прайс-листа...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/calculator.js"></script>
</body>
</html>
