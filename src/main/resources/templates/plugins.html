<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Плагины')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}

    .plugin-shell { height: calc(100vh - 210px); min-height: 460px; display: flex; flex-direction: column; gap: 10px; }
    .plugin-info { background: var(--c-primary-l); border-left: 4px solid var(--c-primary); border-radius: 8px; padding: 12px 14px; }
    .plugin-info h3 { margin: 0 0 4px 0; font-size: 15px; }
    .plugin-info p  { margin: 0; font-size: 13px; color: var(--c-muted); }

    .plugin-frame-wrap { flex: 1; border: 1px solid var(--c-border); border-radius: 10px; overflow: hidden; background: #fff; }
    #pluginFrame { width: 100%; height: 100%; border: none; display: none; background: #fff; }
    #pluginEmpty { display: grid; place-items: center; height: 100%; color: var(--c-muted); font-size: 14px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar()}"></aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>🧩 Плагины</h1>
      <a class="btn btn-secondary" href="/admin#tabPlugins" sec:authorize="hasRole('ADMIN')">⚙️ Управление плагинами</a>
    </header>

    <main class="content">
      <div class="plugin-shell">
        <div class="plugin-info">
          <h3 id="pluginTitle">Плагин не выбран</h3>
          <p id="pluginDescription">Откройте плагин через левое меню.</p>
        </div>

        <div class="plugin-frame-wrap">
          <div id="pluginEmpty">Здесь будет открыт выбранный плагин</div>
          <iframe id="pluginFrame" title="Плагин"></iframe>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/plugins.js"></script>
</body>
</html>
