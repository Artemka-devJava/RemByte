<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <th:block th:replace="~{fragments/head-common :: commonHead('FixByte CRM — Панель управления')}"></th:block>
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" th:replace="~{fragments/sidebar-shell :: sidebar()}"></aside>

  <div class="main-area">
    <header class="top-bar"><h1>📊 Панель управления</h1></header>
    <main class="content">
      <div class="quick-actions">
        <a href="/orders?new=1" class="btn btn-primary">➕ Новый заказ</a>
        <a href="/clients" class="btn btn-secondary">👥 Клиенты</a>
        <a href="/services" class="btn btn-secondary">🔧 Услуги</a>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-label">Всего клиентов</div><div class="number" id="totalClients">—</div></div>
        <div class="stat-card"><div class="stat-icon">⚙️</div><div class="stat-label">Активные заказы</div><div class="number" id="activeOrders">—</div></div>
        <div class="stat-card"><div class="stat-icon">💰</div><div class="stat-label">Выручка за месяц</div><div class="number" id="monthlyRevenue">—</div></div>
        <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-label">Оплачено</div><div class="number" id="totalPaid">—</div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
        <div class="card">
          <div class="card-header"><h2>📋 Последние заказы</h2><a href="/orders" class="btn btn-sm btn-secondary">Все →</a></div>
          <div style="overflow-x:auto;">
            <table class="data-table" id="recentOrders">
              <thead><tr><th>№</th><th>Клиент</th><th>Статус</th><th>Сумма</th><th>Оплачено</th></tr></thead>
              <tbody><tr><td colspan="5" class="empty">Нет заказов</td></tr></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><h2>🏆 Популярные услуги</h2></div>
          <div class="card-body">
            <ul id="popularServices" style="list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13.5px;">
              <li style="color:var(--c-muted)">Загрузка...</li>
            </ul>
          </div>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026 — Система управления сервисом ремонта ПК</footer>
  </div>
</div>
<th:block th:replace="~{fragments/common-scripts :: uiBase}"></th:block>
<script src="/js/api.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
