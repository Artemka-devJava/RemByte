<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FixByte CRM — Услуги</title>
  <link rel='icon' type='image/x-icon' href='/images/favicon.ico'>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .sidebar-user{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);margin-top:auto;}
    .sidebar-user-name{font-size:12px;color:#64748b;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .btn-sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:7px;color:#fca5a5;font-size:12.5px;font-family:inherit;cursor:pointer;transition:all .2s;}
    .btn-sidebar-logout:hover{background:rgba(239,68,68,.2);color:#fff;}
    .cat-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:#f1f5f9;border:1px solid var(--c-border);border-radius:20px;font-size:12.5px;cursor:default;}
    .cat-chip-del{cursor:pointer;color:var(--c-muted);font-size:14px;line-height:1;background:none;border:none;padding:0;}
    .cat-chip-del:hover{color:var(--c-danger);}
    .cat-chip-edit{cursor:pointer;color:var(--c-muted);font-size:12px;line-height:1;background:none;border:none;padding:0 2px;}
    .cat-chip-edit:hover{color:var(--c-primary);}
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="/images/logo.png" alt="FixByte логотип"></div>
      <div><span class="logo-text">FixByte</span><span class="logo-sub">CRM-система</span></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/"           class="nav-item"><span class="nav-icon">🏠</span>Главная</a>
      <a href="/dashboard"  class="nav-item"><span class="nav-icon">📊</span>Панель</a>
      <a href="/clients"    class="nav-item"><span class="nav-icon">👥</span>Клиенты</a>
      <a href="/orders"     class="nav-item"><span class="nav-icon">📋</span>Заказы</a>
      <a href="/services"   class="nav-item active"><span class="nav-icon">🔧</span>Услуги</a>
      <a href="/calculator" class="nav-item"><span class="nav-icon">💰</span>Калькулятор</a>

      <a href="/admin"      class="nav-item" sec:authorize="hasRole('ADMIN')"><span class="nav-icon">⚙️</span>Настройки</a>
    </nav>
    <div class="theme-switcher">
      <label for="themeSelectServices">Тема</label>
      <select id="themeSelectServices" class="theme-select" data-theme-select>
        <option value="system">🔄 Системная</option>
        <option value="light">☀️ Светлая</option>
        <option value="dark">🌙 Тёмная</option>
        <option value="fixbyte">⚡ FixByte</option>
        <option value="green">🌿 Зелёная</option>
        <option value="purple">💜 Фиолетовая</option>
        <option value="ocean">🌊 Океан</option>
        <option value="sunset">🌅 Закат</option>
      </select>
    </div>
    <div class="sidebar-footer">FixByte CRM © 2026</div>
    <div class="sidebar-user">
      <div class="sidebar-user-name" th:text="'👤 ' + ${#authentication?.name ?: ''}">👤 admin</div>
      <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf}"/>
        <button type="submit" class="btn-sidebar-logout">🚪 Выйти</button>
      </form>
    </div>
  </aside>

  <div class="main-area">
    <header class="top-bar">
      <h1>🔧 Услуги</h1>
      <button class="btn btn-primary" onclick="openCreateServiceForm()">+ Добавить услугу</button>
    </header>

    <main class="content">

      <!-- Управление категориями (только ADMIN) -->
      <div class="card" sec:authorize="hasRole('ADMIN')" style="margin-bottom:18px;">
        <div class="card-header">
          <h2>🗂 Категории услуг</h2>
          <button class="btn btn-sm btn-primary" onclick="openCategoryModal()">+ Добавить категорию</button>
        </div>
        <div class="card-body">
          <div id="categoriesList" style="display:flex;flex-wrap:wrap;gap:8px;">
            <span style="color:var(--c-muted);font-size:13px;">Загрузка...</span>
          </div>
        </div>
      </div>

      <div class="filter-bar">
        <label>Категория:</label>
        <select id="categoryFilter" onchange="loadServices()">
          <option value="">Все категории</option>
        </select>
      </div>

      <div class="card">
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Название</th>
                <th>Описание</th>
                <th>Категория</th>
                <th>Цена</th>
                <th>Статус</th>
                <th>Действия</th>
              </tr>
            </thead>
            <tbody id="servicesTable">
              <tr><td colspan="6" class="empty">Загрузка услуг...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="page-footer">FixByte CRM © 2026</footer>
  </div>
</div>

<!-- Модал: добавить/редактировать услугу -->
<div id="createServiceModal" class="modal" style="display:none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="serviceModalTitle">Добавить услугу</h2>
      <button class="close" onclick="closeCreateServiceForm()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="createServiceForm" onsubmit="submitService(event)">
        <div class="form-group">
          <label>Название услуги:</label>
          <input type="text" id="serviceName" required placeholder="Замена BGA микросхемы">
        </div>
        <div class="form-group">
          <label>Описание:</label>
          <textarea id="serviceDescription" placeholder="Подробное описание услуги..."></textarea>
        </div>
        <div class="form-group">
          <label>Категория:</label>
          <select id="serviceCategory" required>
            <option value="">Загрузка категорий...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Базовая цена (₽):</label>
          <input type="number" id="servicePrice" required min="0" step="100" placeholder="3500">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px;">
          <input type="checkbox" id="serviceIsActive" checked style="width:18px;height:18px;cursor:pointer;">
          <label for="serviceIsActive" style="margin:0;cursor:pointer;">Услуга активна</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Сохранить</button>
      </form>
    </div>
  </div>
</div>

<!-- Модал: добавить/редактировать категорию (только ADMIN) -->
<div id="categoryModal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:520px; width:95%;">
    <div class="modal-header">
      <h2 id="categoryModalTitle">Новая категория</h2>
      <button class="close" onclick="closeCategoryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <form id="categoryForm" onsubmit="submitCategory(event)">
        <div class="form-group">
          <label>Название категории:</label>
          <input type="text" id="catName" required placeholder="Клавиатуры" style="width:100%;height:40px;font-size:14px;">
        </div>
        <div class="form-group">
          <label>Иконка (эмодзи):</label>
          <input type="text" id="catIcon" placeholder="⌨️" maxlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Добавить</button>
      </form>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/theme.js"></script>
<script src="/js/plugin-host.js"></script>
<script src="/js/api.js"></script>
<script src="/js/services.js"></script>
</body>
</html>
