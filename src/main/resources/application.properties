spring.application.name=FixByte CRM
server.port=9087
server.servlet.context-path=/

# Thymeleaf (шаблонизатор)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# Статический контент
spring.web.resources.static-locations=classpath:/static/

# Профиль приложения: dev (по умолчанию) или prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.rembyte=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

# ===== FIXBYTE АВТОРИЗАЦИЯ =====
# Учетные данные задаются только в profile-specific файлах через env-переменные.

# Отключить авто-генерацию пароля Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# ===== Реквизиты компании (шапка чека и акта приёмки) =====
# Это только НАЧАЛЬНЫЕ значения при первом старте — дальше редактируются в
# панели администратора («Настройки чека») и хранятся в БД (company_settings).
# Кириллицу в .properties держать нельзя (ISO-8859-1) — задавайте через env/панель.
fixbyte.company.name=${FIXBYTE_COMPANY_NAME:FixByte}
fixbyte.company.subtitle=${FIXBYTE_COMPANY_SUBTITLE:}
fixbyte.company.address=${FIXBYTE_COMPANY_ADDRESS:}
fixbyte.company.phone=${FIXBYTE_COMPANY_PHONE:}
fixbyte.company.email=${FIXBYTE_COMPANY_EMAIL:}

# ===== Напоминания =====
# Через сколько дней «готовый, но не забранный» заказ попадает в напоминания.
fixbyte.reminders.stale-order-days=${FIXBYTE_STALE_ORDER_DAYS:30}

# ===== Загрузка файлов к заказам =====
fixbyte.upload.dir=${FIXBYTE_UPLOAD_DIR:uploads}
fixbyte.upload.max-files-per-request=${FIXBYTE_UPLOAD_MAX_FILES:10}
fixbyte.upload.allowed-image-extensions=${FIXBYTE_ALLOWED_IMAGE_EXTENSIONS:.jpg,.jpeg,.png,.webp,.gif}
fixbyte.upload.allowed-video-extensions=${FIXBYTE_ALLOWED_VIDEO_EXTENSIONS:.mp4,.webm,.mov,.m4v}
fixbyte.upload.max-image-size=${FIXBYTE_MAX_IMAGE_SIZE:15MB}
fixbyte.upload.max-video-size=${FIXBYTE_MAX_VIDEO_SIZE:120MB}
spring.servlet.multipart.max-file-size=${FIXBYTE_MAX_FILE_SIZE:80MB}
spring.servlet.multipart.max-request-size=${FIXBYTE_MAX_REQUEST_SIZE:200MB}

# ===== Миграция legacy-вложений (uploads -> MariaDB) =====
fixbyte.upload.migration.enabled=${FIXBYTE_UPLOAD_MIGRATION_ENABLED:true}
fixbyte.upload.migration.delete-legacy=${FIXBYTE_UPLOAD_MIGRATION_DELETE_LEGACY:false}

# ===== Резервное копирование =====
# Каталог для ПОЛНЫХ бэкапов (обратная совместимость / значение по умолчанию —
# см. также выбор пути в панели администратора ниже). Может быть смонтированной
# шарой Samba/CIFS — тогда полные бэкапы «сохраняются через samba». Пусто =
# хранилище выключено, пока не выбран путь в панели.
fixbyte.backup.dir=${FIXBYTE_BACKUP_DIR:}
# Каталог, смонтированный в docker-compose (по умолчанию /mnt) — единственное
# место, куда реально можно писать в контейнере. Путь, выбранный в панели
# администратора, обязан лежать внутри этого каталога.
fixbyte.backup.base-dir=${FIXBYTE_BACKUP_BASE_DIR:/mnt}
# Сколько последних бэкапов держать в хранилище (старые удаляются). 0 = не удалять.
fixbyte.backup.keep=${FIXBYTE_BACKUP_KEEP:14}
# Периодичность автоматического полного бэкапа задаётся в панели администратора
# («База данных» → Автоматический бэкап): выключено / день / месяц / квартал / год.
# Проверка срока — каждую ночь в 03:30.

