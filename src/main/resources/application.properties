spring.application.name=FixByte CRM
server.port=9087
server.servlet.context-path=/

# Thymeleaf (шаблонизатор)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# Статический контент
spring.web.resources.static-locations=classpath:/static/

# Профиль приложения: dev (по умолчанию) или prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.rembyte=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

# ===== FIXBYTE АВТОРИЗАЦИЯ =====
# Учетные данные задаются только в profile-specific файлах через env-переменные.

# Отключить авто-генерацию пароля Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

# ===== Загрузка файлов к заказам =====
fixbyte.upload.dir=${FIXBYTE_UPLOAD_DIR:uploads}
fixbyte.upload.max-files-per-request=${FIXBYTE_UPLOAD_MAX_FILES:10}
fixbyte.upload.allowed-image-extensions=${FIXBYTE_ALLOWED_IMAGE_EXTENSIONS:.jpg,.jpeg,.png,.webp,.gif}
fixbyte.upload.allowed-video-extensions=${FIXBYTE_ALLOWED_VIDEO_EXTENSIONS:.mp4,.webm,.mov,.m4v}
fixbyte.upload.max-image-size=${FIXBYTE_MAX_IMAGE_SIZE:15MB}
fixbyte.upload.max-video-size=${FIXBYTE_MAX_VIDEO_SIZE:120MB}
spring.servlet.multipart.max-file-size=${FIXBYTE_MAX_FILE_SIZE:80MB}
spring.servlet.multipart.max-request-size=${FIXBYTE_MAX_REQUEST_SIZE:200MB}

# ===== Миграция legacy-вложений (uploads -> MariaDB) =====
fixbyte.upload.migration.enabled=${FIXBYTE_UPLOAD_MIGRATION_ENABLED:true}
fixbyte.upload.migration.delete-legacy=${FIXBYTE_UPLOAD_MIGRATION_DELETE_LEGACY:false}

# ===== Резервное копирование =====
# Каталог для ПОЛНЫХ бэкапов. Может быть смонтированной шарой Samba/CIFS —
# тогда полные бэкапы «сохраняются через samba». Пусто = хранилище выключено
# (доступно только скачивание бэкапа в браузер).
fixbyte.backup.dir=${FIXBYTE_BACKUP_DIR:}
# Сколько последних бэкапов держать в хранилище (старые удаляются). 0 = не удалять.
fixbyte.backup.keep=${FIXBYTE_BACKUP_KEEP:14}
# Автоматический полный бэкап в хранилище по расписанию (cron из 6 полей).
# '-' = выключено. Пример каждую ночь в 3:30 — 0 30 3 * * *
fixbyte.backup.schedule.cron=${FIXBYTE_BACKUP_CRON:-}

