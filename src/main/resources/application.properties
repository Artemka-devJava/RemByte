spring.application.name=FixByte CRM
server.port=9087
server.servlet.context-path=/

# Thymeleaf (шаблонизатор)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# Статический контент
spring.web.resources.static-locations=classpath:/static/

# Профиль приложения: dev (по умолчанию) или prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:file:.env[.properties]

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.rembyte=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Timezone
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Moscow

# ===== FIXBYTE АВТОРИЗАЦИЯ =====
# Учетные данные задаются только в profile-specific файлах через env-переменные.

# Отключить авто-генерацию пароля Spring Security
spring.security.user.name=disabled
spring.security.user.password=disabled

