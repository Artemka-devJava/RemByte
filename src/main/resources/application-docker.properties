# ============================================================
# Docker-профиль Spring Boot
# Активируется переменной: SPRING_PROFILES_ACTIVE=docker
# Хост БД — имя Docker-сервиса 'db', порт 3306 (внутри сети)
# ============================================================

# База данных (MariaDB внутри Docker-сети)
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://db:3306/rembyte?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${MARIADB_USERNAME:root}
spring.datasource.password=${MARIADB_PASSWORD}

# Автоматически обновлять схему (create-drop опасно, update безопаснее)
spring.jpa.hibernate.ddl-auto=update

# Пользователи приложения (берутся из env)
fixbyte.admin.username=${FIXBYTE_ADMIN_USERNAME}
fixbyte.admin.password=${FIXBYTE_ADMIN_PASSWORD}
fixbyte.operator.username=${FIXBYTE_OPERATOR_USERNAME}
fixbyte.operator.password=${FIXBYTE_OPERATOR_PASSWORD}

