# ============================================================
# Docker-профиль Spring Boot
# Активируется переменной: SPRING_PROFILES_ACTIVE=docker
# Хост БД — имя Docker-сервиса 'db', порт 3306 (внутри сети)
# ============================================================

# База данных (MariaDB внутри Docker-сети)
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://db:3306/rembyte?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${MARIADB_USERNAME:root}
spring.datasource.password=${MARIADB_PASSWORD}

# Автоматически обновлять схему (create-drop опасно, update безопаснее)
spring.jpa.hibernate.ddl-auto=update

# Кэш шаблонов Thymeleaf: в application.properties отключён (нужно для
# горячей перезагрузки вёрстки на dev) — в проде это лишний перепарсинг
# каждого шаблона на каждый запрос, включаем обратно.
spring.thymeleaf.cache=true

# Браузерный кэш статики (JS/CSS/картинки из classpath:/static) — без этого
# браузер перезапрашивает эти файлы на каждый переход между страницами (пусть
# и через condition GET). Только на прод-профилях, не в dev — иначе правки
# в JS/CSS не подхватывались бы без hard refresh во время разработки.
# 1 час, а не дольше: имена файлов без хэша в пути (нет сборки/бандла),
# значит после деплоя новой версии старая версия ещё может отдаваться из
# кэша браузера до истечения max-age — час выбран как компромисс между
# пользой от кэша и риском отдать устаревший JS/CSS после обновления.
spring.web.resources.cache.cachecontrol.max-age=1h

# Пользователи приложения (берутся из env)
fixbyte.admin.username=${FIXBYTE_ADMIN_USERNAME}
fixbyte.admin.password=${FIXBYTE_ADMIN_PASSWORD}
fixbyte.operator.username=${FIXBYTE_OPERATOR_USERNAME}
fixbyte.operator.password=${FIXBYTE_OPERATOR_PASSWORD}

