# Production база данных (MariaDB)
# При необходимости задайте URL через MARIADB_URL, иначе используется локальный шаблон.
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://localhost:9092/rembyte?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${MARIADB_USERNAME}
spring.datasource.password=${MARIADB_PASSWORD}

# В production лучше не менять схему автоматически
spring.jpa.hibernate.ddl-auto=validate

# Production авторизация (только env, без значений по умолчанию)
fixbyte.admin.username=${FIXBYTE_ADMIN_USERNAME}
fixbyte.admin.password=${FIXBYTE_ADMIN_PASSWORD}
fixbyte.operator.username=${FIXBYTE_OPERATOR_USERNAME}
fixbyte.operator.password=${FIXBYTE_OPERATOR_PASSWORD}

