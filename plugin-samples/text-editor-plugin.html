<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Текстовый редактор</title>
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --border:#cbd5e1; --primary:#2563eb; }
    body { margin:0; font-family:Segoe UI, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:18px auto; padding:0 14px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .btn { border:1px solid var(--border); background:var(--card); border-radius:7px; padding:7px 10px; cursor:pointer; font-size:13px; }
    .btn:hover { border-color:var(--primary); color:var(--primary); }
    .editor { width:100%; min-height:360px; border:1px solid var(--border); border-radius:10px; padding:12px; box-sizing:border-box; background:var(--card); font-size:14px; line-height:1.55; }
    .hint { margin-top:8px; color:#64748b; font-size:12px; }
  </style>
</head>
<body>
<div class="wrap">
  <h3>📝 Текстовый редактор (плагин)</h3>
  <div class="toolbar">
    <button class="btn" type="button" onclick="exec('bold')"><b>B</b></button>
    <button class="btn" type="button" onclick="exec('italic')"><i>I</i></button>
    <button class="btn" type="button" onclick="exec('underline')"><u>U</u></button>
    <button class="btn" type="button" onclick="exec('insertUnorderedList')">• Список</button>
    <button class="btn" type="button" onclick="clearEditor()">Очистить</button>
    <button class="btn" type="button" onclick="saveText()">Сохранить локально</button>
    <button class="btn" type="button" onclick="loadText()">Загрузить локально</button>
  </div>
  <div id="editor" class="editor" contenteditable="true">Введите текст...</div>
  <div class="hint">Этот плагин работает в изолированной песочнице и не имеет доступа к CRM.</div>
</div>
<script>
  const KEY = 'sample_text_editor_content';
  function exec(cmd) { document.execCommand(cmd, false, null); }
  function clearEditor() { document.getElementById('editor').innerHTML = ''; }
  function saveText() {
    localStorage.setItem(KEY, document.getElementById('editor').innerHTML);
    alert('Текст сохранен внутри плагина.');
  }
  function loadText() {
    const value = localStorage.getItem(KEY);
    if (value != null) document.getElementById('editor').innerHTML = value;
  }
</script>
</body>
</html>
