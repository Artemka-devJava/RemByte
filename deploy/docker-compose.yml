# ============================================================
# FixByte CRM — Docker (обычный режим, bridge)
# Веб-интерфейс на порту хоста ${HOST_HTTP_PORT:-9087}.
#
#   cd deploy
#   cp .env.example .env      # отредактировать пароли / порт
#   ./up.sh                   # или: docker compose up -d --build
# ============================================================

name: fixbyte-crm

services:

  db:
    image: mariadb:11.4
    container_name: fixbyte-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      MARIADB_DATABASE: rembyte
    volumes:
      - fixbyte-db-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks: [crm_net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile     # runtime-образ из app/app.jar
    image: fixbyte/crm:local
    container_name: fixbyte-app
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-9087}:9087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MARIADB_URL: jdbc:mariadb://db:3306/rembyte?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      MARIADB_USERNAME: root
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-changeme}
      FIXBYTE_ADMIN_USERNAME: ${FIXBYTE_ADMIN_USERNAME:-admin}
      FIXBYTE_ADMIN_PASSWORD: ${FIXBYTE_ADMIN_PASSWORD:-changeme}
      FIXBYTE_OPERATOR_USERNAME: ${FIXBYTE_OPERATOR_USERNAME:-operator}
      FIXBYTE_OPERATOR_PASSWORD: ${FIXBYTE_OPERATOR_PASSWORD:-changeme}
      FIXBYTE_BACKUP_DIR: ${FIXBYTE_BACKUP_DIR:-/backups}
      FIXBYTE_BACKUP_KEEP: ${FIXBYTE_BACKUP_KEEP:-14}
      FIXBYTE_BACKUP_CRON: ${FIXBYTE_BACKUP_CRON:--}
    volumes:
      # Хранилище полных бэкапов. По умолчанию — каталог на хосте (BACKUP_HOST_DIR).
      # Для сохранения через Samba: замените на volume "crm_backups" ниже
      # (driver_opts: type: cifs) и смонтируйте его сюда: - crm_backups:/backups
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks: [crm_net]
    depends_on:
      db:
        condition: service_healthy

networks:
  crm_net:
    driver: bridge

volumes:
  fixbyte-db-data:
    driver: local
  # Полные бэкапы напрямую на шару Samba/CIFS (раскомментируйте и подставьте свои
  # данные, затем в app.volumes замените bind-mount на:  - crm_backups:/backups)
  # crm_backups:
  #   driver_opts:
  #     type: cifs
  #     o: "username=USER,password=PASS,uid=1000,vers=3.0"
  #     device: "//NAS/backups"
