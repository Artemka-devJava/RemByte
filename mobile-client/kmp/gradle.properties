org.gradle.jvmargs=-Xmx2560m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# AGP 9's built-in Kotlin support conflicts with the Kotlin Multiplatform plugin
# applied in the same module (composeApp uses KMP's androidTarget(), not AGP's
# built-in Kotlin) — this is JetBrains/Google's documented escape hatch.
android.builtInKotlin=false
android.newDsl=false
